<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bullet Forge</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#081016;color:#e9f9ff;font-family:system-ui,sans-serif}.wrap{width:min(900px,100%);padding:18px}.top{display:flex;justify-content:space-between;align-items:end;margin:0 2px 11px}.tag{font:600 11px ui-monospace,monospace;letter-spacing:.14em;color:#82eaff}h1{margin:2px 0;font-size:25px;letter-spacing:-.05em}.sub{margin:0;color:#a5bdca;font-size:12px}.game{position:relative;overflow:hidden;border:1px solid #275569;border-radius:12px;background:#07141d}canvas{display:block;width:100%;height:auto}.hud{position:absolute;inset:12px 14px auto;display:flex;justify-content:space-between;font:600 12px ui-monospace;pointer-events:none}.hud b{color:#b9f5ff}.slots{position:absolute;bottom:12px;left:13px;display:flex;gap:6px}.slot{width:67px;height:29px;border:1px solid #416678;border-radius:5px;background:#0d2733;padding:6px;text-align:center;font:10px ui-monospace;color:#82a9b8}.note{position:absolute;bottom:15px;right:13px;font-size:12px;color:#acc7d3}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:30px;background:#061017e9}.hide{display:none}.overlay h2{margin:7px;font-size:31px;letter-spacing:-.06em}.overlay p{color:#acc3ce;font-size:14px;line-height:1.65}.help{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.help div{padding:9px;background:#0c1720;border:1px solid #213a47;border-radius:7px;color:#a8c0ca;font-size:11px;line-height:1.5}.help b{color:#8ae8ff}button{background:#177a93;color:white;border:1px solid #8ce9ff;border-radius:6px;padding:10px 15px;font-weight:700;cursor:pointer}@media(max-width:600px){.help{grid-template-columns:1fr}.wrap{padding:8px}}
</style><body><div class="wrap"><div class="top"><div><div class="tag">02 / DODGE → CAPTURE → COUNTER</div><h1>BULLET FORGE</h1><p class="sub">위험한 탄이 곧 재료다.</p></div><button onclick="start()">재단조 R</button></div><div class="game"><canvas id="c" width="860" height="500"></canvas><div class="hud"><div>TIME <b id="time">75.0</b></div><div>CORE <b id="hp">120</b></div><div>FORGED <b id="score">0</b></div></div><div class="slots"><div class="slot" id="a">EMPTY</div><div class="slot" id="b">EMPTY</div></div><div id="note" class="note"><b>E</b> 탄 흡수 · <b>F</b> 단조 발사</div><div id="over" class="overlay"><div class="tag">BULLET FORGE / SPIKE</div><h2>탄막을 무기로 만드세요.</h2><p>이동 <b>WASD</b> · 가까운 탄 흡수 <b>E</b> · 두 재료 단조 <b>F</b><br>동일한 탄도 쓸 수 있지만, 다른 조합이 더 강합니다.</p><button onclick="start()">단조 시작</button></div></div><div class="help"><div><b>EMBER</b><br>강한 단일 피해</div><div><b>ARC</b><br>연쇄·유도 피해</div><div><b>VOID</b><br>느리지만 광역 피해</div></div></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),K=new Set(),ui={t:document.querySelector('#time'),h:document.querySelector('#hp'),s:document.querySelector('#score'),a:document.querySelector('#a'),b:document.querySelector('#b'),n:document.querySelector('#note'),o:document.querySelector('#over')};let P={x:0,y:0,r:0},B={x:0,y:0,h:0},bullets=[],slots=[],run=false,clock=75,last=0,spawn=0,forged=0;
const types=[['EMBER','#ff6e66'],['ARC','#63dfff'],['VOID','#c590ff']];function start(){P={x:150,y:360,r:10};B={x:655,y:245,h:120};bullets=[];slots=[];clock=75;spawn=.2;forged=0;run=1;ui.o.classList.add('hide');paintSlots()}window.start=start;addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','a','s','d','e','f','r'].includes(k))e.preventDefault();K.add(k);if(k==='r')start();if(k==='e')catchBullet();if(k==='f')forge()});addEventListener('keyup',e=>K.delete(e.key.toLowerCase()));function paintSlots(){ui.a.textContent=slots[0]?.[0]||'EMPTY';ui.a.style.color=slots[0]?.[1]||'#82a9b8';ui.b.textContent=slots[1]?.[0]||'EMPTY';ui.b.style.color=slots[1]?.[1]||'#82a9b8'}function catchBullet(){if(!run||slots.length>1)return;let q=bullets.sort((m,n)=>Math.hypot(P.x-m.x,P.y-m.y)-Math.hypot(P.x-n.x,P.y-n.y))[0];if(q&&Math.hypot(P.x-q.x,P.y-q.y)<42){slots.push(q.type);bullets.splice(bullets.indexOf(q),1);paintSlots()}}function forge(){if(!run||slots.length<2)return;let same=slots[0][0]===slots[1][0],d=same?20:36;B.h-=d;forged++;ui.n.innerHTML=same?'보통 단조: '+d+' 피해':'혼합 단조 성공: '+d+' 피해';slots=[];paintSlots();if(B.h<=0)win()}function win(){run=0;ui.o.innerHTML='<div class="tag">FORGE COMPLETE</div><h2>보스 코어를 녹였습니다.</h2><p>실제 게임에서는 탄 속성·조합식·보스 덱을 늘려 빌드를 확장합니다.</p><button onclick="start()">다시 단조</button>';ui.o.classList.remove('hide')}function update(d){if(!run)return;clock-=d;if(clock<0){run=0;ui.o.innerHTML='<div class="tag">FORGE FAILED</div><h2>불꽃이 꺼졌습니다.</h2><p>탄을 더 가까이 끌어들여 재료를 빠르게 모아보세요.</p><button onclick="start()">다시 단조</button>';ui.o.classList.remove('hide')}let dx=(K.has('d')?1:0)-(K.has('a')?1:0),dy=(K.has('s')?1:0)-(K.has('w')?1:0),z=Math.hypot(dx,dy)||1;P.x=Math.max(14,Math.min(846,P.x+dx/z*210*d));P.y=Math.max(14,Math.min(486,P.y+dy/z*210*d));spawn-=d;if(spawn<0){spawn=.58;let t=types[Math.floor(Math.random()*3)],an=Math.atan2(P.y-B.y,P.x-B.x)+(-.35+Math.random()*.7);bullets.push({x:B.x,y:B.y,vx:Math.cos(an)*105,vy:Math.sin(an)*105,type:t});}for(let q of bullets){q.x+=q.vx*d;q.y+=q.vy*d}bullets=bullets.filter(q=>q.x>-20&&q.y>-20&&q.x<880&&q.y<520);ui.t.textContent=clock.toFixed(1);ui.h.textContent=Math.max(0,B.h);ui.s.textContent=forged}function draw(){x.fillStyle='#07141d';x.fillRect(0,0,860,500);for(let r=50;r<430;r+=58){x.strokeStyle='#0c2b38';x.beginPath();x.arc(430,250,r,0,7);x.stroke()}x.shadowBlur=28;x.shadowColor='#c5faff';x.fillStyle='#2a6072';x.beginPath();x.arc(B.x,B.y,72,0,7);x.fill();x.fillStyle='#d2fbff';x.beginPath();x.arc(B.x,B.y,15,0,7);x.fill();x.shadowBlur=0;for(let q of bullets){x.fillStyle=q.type[1];x.shadowBlur=13;x.shadowColor=q.type[1];x.beginPath();x.arc(q.x,q.y,8,0,7);x.fill();x.shadowBlur=0}x.fillStyle='#f0ffff';x.shadowBlur=18;x.shadowColor='#7ceaff';x.beginPath();x.arc(P.x,P.y,P.r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#7cb9ca';x.font='10px ui-monospace';x.fillText('BOSS CORE',B.x-31,B.y+105)}function loop(n){let d=Math.min(.033,(n-last)/1000||0);last=n;update(d);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
