<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board Core Lab</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,sans-serif;background:#080b13;color:#f2f5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#23345a,#080b13 62%)}main{width:min(920px,calc(100% - 22px));padding:24px 0}.tag{font:600 11px ui-monospace,monospace;letter-spacing:.15em;color:#a8c9ff}header{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:13px}h1{margin:3px 0;font-size:30px;letter-spacing:-.06em}header p{margin:0;color:#a9b5cb;font-size:13px}.links{display:flex;gap:6px;flex-wrap:wrap}.links a{padding:7px 9px;border:1px solid #3a4a68;border-radius:5px;text-decoration:none;color:#bdcce9;font:11px ui-monospace,monospace}.links a.on{background:#5167ad;color:#fff;border-color:#b5c8ff}.stage{overflow:hidden;border:1px solid #50638c;border-radius:14px;background:#11162a;box-shadow:0 22px 72px #0009}.status{display:flex;justify-content:space-between;padding:13px 17px;border-bottom:1px solid #27324a;font:600 12px ui-monospace,monospace;color:#9baccc}.status b{color:#f6f8ff}.battle{height:210px;position:relative;padding:32px;background:linear-gradient(135deg,#131b34,#20142f)}.hero{position:absolute;bottom:31px;width:54px;text-align:center;font:10px ui-monospace,monospace;color:#d3dbf4}.hero i{display:block;width:42px;height:42px;border-radius:50%;margin:auto auto 7px;background:var(--c);box-shadow:0 0 25px var(--c);font-style:normal;color:#101421;line-height:42px;font-weight:800}.boss{position:absolute;right:15%;top:32px;text-align:center}.boss i{display:grid;place-items:center;width:90px;height:90px;border-radius:50%;background:#503c89;box-shadow:0 0 38px #9b7aff;color:#e9e2ff;font:800 12px ui-monospace,monospace;font-style:normal}.boss b{display:block;margin-top:9px;font:10px ui-monospace,monospace;color:#d2c7ff}.intent{position:absolute;right:13%;bottom:28px;padding:7px 9px;border:1px solid #9a8eff;border-radius:5px;background:#29214b;font:11px ui-monospace,monospace;color:#ffd2dc}.board-area{min-height:315px;position:relative;padding:20px;background:#0d1220}.prompt{display:flex;justify-content:space-between;gap:10px;min-height:25px;color:#b7c3dc;font-size:12px}.prompt b{color:#dce7ff}.board{height:235px;position:relative;margin:auto;max-width:650px}.token{position:absolute;width:51px;height:43px;border:1px solid #3c4b6a;border-radius:8px;background:#192238;color:#d7e1fb;font:800 10px ui-monospace,monospace;cursor:pointer;transition:.13s}.token:hover{transform:scale(1.08);background:#2b3a5d}.token.sel{outline:3px solid #ecf2ff;z-index:2;transform:scale(1.12)}.token[data-t="G"]{color:#f4c96e}.token[data-t="E"]{color:#f1809a}.token[data-t="P"]{color:#72e0e4}.line{position:absolute;height:3px;background:#dce7ff;transform-origin:0 50%;pointer-events:none;opacity:.75}.actions{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid #27324a;background:#10162a}.notice{flex:1;color:#b8c4dd;font-size:12px;min-height:18px}.go,.reset{border:1px solid #b9ceff;border-radius:7px;background:#546db7;color:white;padding:10px 15px;font-weight:700;cursor:pointer}.reset{background:#252e45;border-color:#5d6f92;font-size:12px}.guide{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.guide div{padding:10px;border:1px solid #26324c;border-radius:8px;background:#0c1120;color:#aebad1;font-size:11px;line-height:1.55}.guide b{color:#d6e1ff}@media(max-width:640px){main{padding:10px 0}header{align-items:start;flex-direction:column}.battle{height:170px}.boss{right:8%;top:22px}.intent{right:7%;bottom:15px}.board-area{padding:13px}.board{transform:scale(.88);transform-origin:top center;margin-bottom:-28px}.guide{grid-template-columns:1fr}}
</style><body><main><header><div><div class="tag">ORIGINAL BLOCK / ORB CORE LAB</div><h1 id="title"></h1><p id="subtitle"></p></div><nav class="links"><a id="tri" href="?mode=triangle">TRIANGLE</a><a id="orb" href="?mode=orbit">ORBIT</a><a id="zip" href="?mode=zipper">ZIPPER</a></nav></header><section class="stage"><div class="status"><span>PARTY <b id="party">READY</b></span><span>ENEMY INTENT <b id="intent">CRUSH</b></span><span>COMBO <b id="combo">0</b></span></div><div class="battle"><div class="hero" style="left:14%;--c:#f4c96e"><i>G</i>GUARD</div><div class="hero" style="left:25%;--c:#f1809a"><i>E</i>EDGE</div><div class="hero" style="left:36%;--c:#72e0e4"><i>P</i>PULSE</div><div class="boss"><i>NULL<br>KING</i><b>THE NULL KING</b></div><div class="intent">NEXT: <span id="battleIntent">CRUSH</span></div></div><div class="board-area"><div class="prompt"><span id="rule"></span><b id="path">PATH: —</b></div><div id="board" class="board"></div></div><div class="actions"><div class="notice" id="notice"></div><button class="reset" id="reset">RESET</button><button class="go" id="go">EXECUTE</button></div></section><section class="guide" id="guide"></section></main><script>
const mode=new URLSearchParams(location.search).get('mode')||'triangle',cfg={
triangle:{title:'TRIANGLE CIRCUIT',sub:'세 변을 따라 만든 경로가 파티 참여자와 기술의 크기를 결정합니다.',rule:'둘레에서 인접한 블록을 1~4개 이으세요. 꼭짓점을 넘으면 협동기가 됩니다.',guide:['같은 변에서 끝내면 그 변의 영웅 단독기','꼭짓점을 지나면 두 영웅이 경로에 참여','두 꼭짓점을 지나는 긴 경로는 3인 합동기'],count:12,layout:'triangle'},
orbit:{title:'ORBIT DIAL',sub:'원형 궤도에서 호를 쓸어 선택합니다. 방향 자체가 공격과 방어를 가릅니다.',rule:'원에서 인접한 블록을 1~4개 이으세요. 시계방향은 공격, 반시계는 방어 성향입니다.',guide:['시계방향 호: 공격적인 명령','반시계 호: 방어·회복 명령','긴 호는 강력하지만 다음 턴의 선택지를 태웁니다'],count:10,layout:'orbit'},
zipper:{title:'ZIPPER LINE',sub:'두 줄의 명령을 지퍼처럼 엮습니다. 직선과 대각선의 의미가 다릅니다.',rule:'인접한 블록을 2~4개 이으세요. 같은 열은 방어, 대각선 전환은 연계기입니다.',guide:['세로 연결: 두 역할의 안정적인 보호','대각선 연결: 역할을 교차하는 공격 연계','지그재그가 길수록 보상과 위험이 함께 커짐'],count:10,layout:'zipper'}}[mode]||null;
if(!cfg)location.search='?mode=triangle';document.title=cfg.title;title.textContent=cfg.title;subtitle.textContent=cfg.sub;document.getElementById(mode==='triangle'?'tri':mode==='orbit'?'orb':'zip').classList.add('on');guide.innerHTML=cfg.guide.map((v,i)=>`<div><b>0${i+1}</b><br>${v}</div>`).join('');
const B=document.querySelector('#board'),types=['G','E','P'];let cells=[],pick=[],combo=0,notice='블록을 선택해 새 전투 문장을 만드세요.';const rand=()=>types[Math.floor(Math.random()*3)];
function pos(i){if(cfg.layout==='triangle'){let pts=[[300,13],[382,58],[464,103],[546,148],[575,196],[460,196],[345,196],[230,196],[115,196],[144,148],[226,103],[308,58]];return{x:pts[i][0],y:pts[i][1]}}if(cfg.layout==='orbit'){let a=-Math.PI/2+i*Math.PI*2/cfg.count;return{x:300+113*Math.cos(a),y:118+94*Math.sin(a)}}let col=i%5,row=Math.floor(i/5);return{x:148+col*76,y:70+row*88}}
function linked(a,b){if(cfg.layout==='triangle'||cfg.layout==='orbit'){let d=Math.abs(a-b);return d===1||d===cfg.count-1}let ac=a%5,ar=Math.floor(a/5),bc=b%5,br=Math.floor(b/5);return Math.abs(ac-bc)<=1&&Math.abs(ar-br)<=1}
function setup(){cells=Array.from({length:cfg.count},rand);pick=[];combo=0;notice='블록을 선택해 새 전투 문장을 만드세요.';paint()}
function choose(i){if(pick.includes(i)){pick=pick.filter(v=>v!==i)}else if(pick.length>=4){notice='한 경로는 최대 네 블록입니다.'}else if(pick.length&& !linked(pick.at(-1),i)){notice='직전 블록과 닿는 위치만 이을 수 있습니다.'}else pick.push(i);paint()}
function paint(){B.innerHTML='';let ps=[];cells.forEach((t,i)=>{let p=pos(i),e=document.createElement('button');e.className='token'+(pick.includes(i)?' sel':'');e.dataset.t=t;e.textContent={G:'GUARD',E:'EDGE',P:'PULSE'}[t];e.style.left=p.x+'px';e.style.top=p.y+'px';e.onclick=()=>choose(i);B.append(e);ps.push(p)});for(let j=1;j<pick.length;j++){let a=pos(pick[j-1]),b=pos(pick[j]),dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy),q=document.createElement('i');q.className='line';q.style.width=l+'px';q.style.left=(a.x+25)+'px';q.style.top=(a.y+21)+'px';q.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;B.append(q)}path.textContent='PATH: '+(pick.length?pick.map(i=>cells[i]).join(' → '):'—');notice&& (document.querySelector('#notice').textContent=notice);combo.textContent=combo;}
function execute(){if(!pick.length)return;let kind='',cross=0;if(cfg.layout==='triangle'){cross=pick.filter(i=>[0,4,8].includes(i)).length;kind=cross>=2?'TRINITY CIRCUIT':cross===1?'VERTEX RELAY':'EDGE TECHNIQUE'}else if(cfg.layout==='orbit'){let dir=pick.length>1?(pick[1]-pick[0]+cfg.count)%cfg.count:0;kind=dir===1?'CLOCKWISE STRIKE':dir===cfg.count-1?'COUNTER-ORBIT':'ORBIT PULSE'}else{let vertical=0,diagonal=0;for(let j=1;j<pick.length;j++){let d=Math.abs(pick[j]%5-pick[j-1]%5);if(d===0)vertical++;if(d===1)diagonal++}kind=diagonal>vertical?'CROSS ZIPPER':'LOCK ZIPPER'}combo+=pick.length;notice=kind+' 발동 · '+pick.length+'개의 블록을 전투 문장으로 사용했습니다.';pick.forEach(i=>cells[i]=rand());pick=[];let its=['CRUSH','HEX','BARRAGE'];let n=its[(combo+pick.length)%3];intent.textContent=n;battleIntent.textContent=n;party.textContent=kind;paint()}
go.onclick=execute;reset.onclick=setup;setup();
</script></body></html>
