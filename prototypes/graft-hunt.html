<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graft Hunt</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a0d;color:#f5eee6;font-family:system-ui,sans-serif}.wrap{width:min(900px,100%);padding:18px}.top{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:0 2px 11px}.tag{font:600 11px ui-monospace,monospace;letter-spacing:.14em;color:#ffb080}h1{font-size:25px;margin:2px 0;letter-spacing:-.05em}.sub{font-size:12px;color:#b9a99f;margin:0}.game{position:relative;border:1px solid #633d31;border-radius:12px;overflow:hidden;background:#170e0d}canvas{display:block;width:100%;height:auto}.hud{position:absolute;inset:12px 13px auto;display:flex;justify-content:space-between;font:600 12px ui-monospace,monospace;pointer-events:none}.hud b{color:#ffd7be}.note{position:absolute;bottom:12px;left:13px;font-size:12px;color:#d0b6a9}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#120907e8;padding:30px}.overlay.hide{display:none}.overlay h2{font-size:31px;letter-spacing:-.06em;margin:7px}.overlay p{color:#c9b3a7;font-size:14px;line-height:1.6}.overlay button{margin:12px auto 0}.help{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.help div{padding:9px;border:1px solid #3e2a25;border-radius:7px;background:#151011;color:#c8b8ae;font-size:11px;line-height:1.5}.help b{color:#ffb384}button{background:#a94728;border:1px solid #ffb183;border-radius:6px;padding:10px 15px;color:white;font-weight:700;cursor:pointer}@media(max-width:600px){.help{grid-template-columns:1fr}.wrap{padding:8px}.top{align-items:start}}
</style><body><div class="wrap"><div class="top"><div><div class="tag">01 / PART-ORDER BOSS HUNT</div><h1>GRAFT HUNT</h1><p class="sub">무엇을 먼저 뜯을 것인가?</p></div><button onclick="start()">새 사냥 R</button></div><div class="game"><canvas id="c" width="860" height="500"></canvas><div class="hud"><div>TIME <b id="time">75.0</b></div><div>HARVEST <b id="harvest">—</b></div><div>BOSS <b id="boss">3 PARTS</b></div></div><div id="note" class="note">가까이 가서 <b>J</b>로 부위를 공격하세요.</div><div id="over" class="overlay"><div class="tag">GRAFT HUNT / SPIKE</div><h2>괴수의 부위를 빼앗아라.</h2><p>이동 <b>WASD</b> · 대시 <b>Space</b> · 근접 공격 <b>J</b><br>발톱·날개·심장 중 어떤 부위를 먼저 파괴할지 선택합니다.</p><button onclick="start()">사냥 시작</button></div></div><div class="help"><div><b>발톱</b><br>파괴 시 돌진 공격 획득</div><div><b>날개</b><br>파괴 시 대시 충전 2회</div><div><b>심장</b><br>파괴 시 피니시, 대신 시간이 감소</div></div></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),K=new Set(),ui={t:document.querySelector('#time'),h:document.querySelector('#harvest'),b:document.querySelector('#boss'),n:document.querySelector('#note'),o:document.querySelector('#over')};let P={x:0,y:0,r:0,dash:0,cd:0,boost:1},parts=[],run=false,clock=75,last=0,msg='',flash=0;
const reset=()=>{P={x:110,y:390,r:11,dash:0,cd:0,boost:1};parts=[{n:'CLAW',x:490,y:330,h:72,max:72,col:'#ef674e',alive:1},{n:'WING',x:600,y:170,h:64,max:64,col:'#d59aff',alive:1},{n:'HEART',x:680,y:330,h:92,max:92,col:'#ffc35b',alive:1}];clock=75;msg='';flash=0;run=true;ui.o.classList.add('hide');ui.h.textContent='—';ui.n.innerHTML='가까이 가서 <b>J</b>로 부위를 공격하세요.'};window.start=reset;
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','a','s','d','j','r',' '].includes(k))e.preventDefault();K.add(k);if(k==='r')reset();if(k===' '&&run&&P.cd<=0){P.dash=.16;P.cd=.9/P.boost}if(k==='j')hit()});addEventListener('keyup',e=>K.delete(e.key.toLowerCase()));
function hit(){if(!run)return;let q=parts.filter(a=>a.alive).sort((a,b)=>Math.hypot(P.x-a.x,P.y-a.y)-Math.hypot(P.x-b.x,P.y-b.y))[0];if(q&&Math.hypot(P.x-q.x,P.y-q.y)<85){q.h-=18;flash=.12;if(q.h<=0){q.alive=0;take(q)}}else msg='너무 멉니다';}
function take(q){if(q.n==='CLAW'){P.boost=1.3;msg='발톱 획득: 공격 범위 증가';ui.h.textContent='CLAW / CHARGE'}if(q.n==='WING'){P.boost=2;msg='날개 획득: 대시 재충전 증가';ui.h.textContent='WING / DOUBLE DASH'}if(q.n==='HEART'){clock-=14;msg='심장 획득: 시간이 14초 줄었습니다';ui.h.textContent='HEART / FINISH'}if(!parts.some(a=>a.alive)){run=false;ui.n.textContent='사냥 성공. 부위 파괴 순서가 다음 빌드와 난이도를 결정합니다.';ui.o.innerHTML='<div class="tag">HUNT COMPLETE</div><h2>괴수를 해체했습니다.</h2><p>이번 사냥에서 얻은 능력은 실제 게임에서는 다음 보스전의 빌드가 됩니다.</p><button onclick="start()">다시 사냥</button>';ui.o.classList.remove('hide')}}
function update(dt){if(!run)return;clock-=dt;if(clock<0){run=false;ui.o.innerHTML='<div class="tag">HUNT FAILED</div><h2>해가 졌습니다.</h2><p>부위 선택과 공격 위치를 바꿔 다시 시도하세요.</p><button onclick="start()">다시 사냥</button>';ui.o.classList.remove('hide')}let dx=(K.has('d')?1:0)-(K.has('a')?1:0),dy=(K.has('s')?1:0)-(K.has('w')?1:0);let z=Math.hypot(dx,dy)||1;P.dash=Math.max(0,P.dash-dt);P.cd=Math.max(0,P.cd-dt);P.x=Math.max(20,Math.min(840,P.x+dx/z*(P.dash?420:180)*dt));P.y=Math.max(30,Math.min(480,P.y+dy/z*(P.dash?420:180)*dt));flash=Math.max(0,flash-dt);ui.t.textContent=clock.toFixed(1);ui.b.textContent=parts.filter(a=>a.alive).length+' PARTS';ui.n.innerHTML=msg||'가까이 가서 <b>J</b>로 부위를 공격하세요.'}
function draw(){x.fillStyle='#170e0d';x.fillRect(0,0,860,500);for(let i=0;i<16;i++){x.strokeStyle='#3a201d';x.beginPath();x.moveTo(i*60,0);x.lineTo(i*60+110,500);x.stroke()}x.fillStyle='#42231d';x.beginPath();x.ellipse(650,278,150,130,0,0,7);x.fill();x.fillStyle='#25120f';x.beginPath();x.arc(650,270,72,0,7);x.fill();for(const q of parts){if(!q.alive)continue;x.shadowBlur=18;x.shadowColor=q.col;x.fillStyle=q.col;x.beginPath();x.arc(q.x,q.y,20,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#251311';x.fillRect(q.x-30,q.y-38,60,5);x.fillStyle=q.col;x.fillRect(q.x-30,q.y-38,60*q.h/q.max,5);x.fillStyle='#f9ded0';x.font='10px ui-monospace';x.textAlign='center';x.fillText(q.n,q.x,q.y+39)}x.strokeStyle='#ffb889';x.lineWidth=3;x.beginPath();x.arc(P.x,P.y,flash?36:18,0,7);x.stroke();x.fillStyle=P.dash?'#fff7d9':'#ffb383';x.beginPath();x.arc(P.x,P.y,P.r,0,7);x.fill();x.fillStyle='#dd8567';x.font='11px ui-monospace';x.textAlign='left';x.fillText(P.cd>0?'DASH RECHARGING':'DASH READY',14,35)}
function loop(n){let d=Math.min(.033,(n-last)/1000||0);last=n;update(d);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
